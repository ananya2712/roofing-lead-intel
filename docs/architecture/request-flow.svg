<svg id="request-flow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 690" role="img" aria-labelledby="request-title request-desc"><title id="request-title">Architecture and detailed request flow</title><desc id="request-desc">Twelve ordered runtime steps through UI, typed client, Next.js proxy, route validation, service logic, ORM, PostgreSQL, saved-state reload, response model, JSON, error handling and UI refresh. Six separate setup steps import and score recorded snapshots.</desc><defs><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#2157A4"/></marker><marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#16734D"/></marker></defs><rect width="1280" height="690" fill="#FFFFFF"/><g font-family="Arial, sans-serif"><text x="64" y="90" font-size="48" fill="#0E2A47" font-weight="700">Architecture and data flow</text><text x="64" y="150" font-size="24" fill="#2157A4" font-weight="700">REQUEST · Browser / Next.js / Flask</text><text x="64" y="331" font-size="24" fill="#16734D" font-weight="700">RESPONSE · Database state back to the UI</text><path d="M 236 225 L 260 225" fill="none" stroke="#2157A4" stroke-width="2"/><polygon points="260,225 251,220 251,230" fill="#2157A4"/><path d="M 432 225 L 456 225" fill="none" stroke="#2157A4" stroke-width="2"/><polygon points="456,225 447,220 447,230" fill="#2157A4"/><path d="M 628 225 L 652 225" fill="none" stroke="#2157A4" stroke-width="2"/><polygon points="652,225 643,220 643,230" fill="#2157A4"/><path d="M 824 225 L 848 225" fill="none" stroke="#2157A4" stroke-width="2"/><polygon points="848,225 839,220 839,230" fill="#2157A4"/><path d="M 1020 225 L 1044 225" fill="none" stroke="#2157A4" stroke-width="2"/><polygon points="1044,225 1035,220 1035,230" fill="#2157A4"/><path d="M 1130 283 L 1130 350" fill="none" stroke="#2157A4" stroke-width="2"/><polygon points="1130,350 1125,341 1135,341" fill="#2157A4"/><path d="M 1044 408 L 1020 408" fill="none" stroke="#16734D" stroke-width="2"/><polygon points="1020,408 1029,403 1029,413" fill="#16734D"/><path d="M 848 408 L 824 408" fill="none" stroke="#16734D" stroke-width="2"/><polygon points="824,408 833,403 833,413" fill="#16734D"/><path d="M 652 408 L 628 408" fill="none" stroke="#16734D" stroke-width="2"/><polygon points="628,408 637,403 637,413" fill="#16734D"/><path d="M 456 408 L 432 408" fill="none" stroke="#16734D" stroke-width="2"/><polygon points="432,408 441,403 441,413" fill="#16734D"/><path d="M 260 408 L 236 408" fill="none" stroke="#16734D" stroke-width="2"/><polygon points="236,408 245,403 245,413" fill="#16734D"/><g id="step-1"><rect x="64" y="167" width="172" height="116" fill="#F5F7FA" stroke="#DCE3EC"/><text x="74" y="203" font-size="26" fill="#0E2A47" font-weight="700">1 · React</text><text x="74" y="244" font-size="24" fill="#172B42">Open / filter</text><text x="74" y="272" font-size="24" fill="#172B42">or save</text></g><g id="step-2"><rect x="260" y="167" width="172" height="116" fill="#F5F7FA" stroke="#DCE3EC"/><text x="270" y="203" font-size="26" fill="#0E2A47" font-weight="700">2 · Client</text><text x="270" y="244" font-size="24" fill="#172B42">Typed GET</text><text x="270" y="272" font-size="24" fill="#172B42">or POST</text></g><g id="step-3"><rect x="456" y="167" width="172" height="116" fill="#F5F7FA" stroke="#DCE3EC"/><text x="466" y="203" font-size="26" fill="#0E2A47" font-weight="700">3 · Proxy</text><text x="466" y="244" font-size="24" fill="#172B42">Next.js</text><text x="466" y="272" font-size="24" fill="#172B42">/api/v1 rewrite</text></g><g id="step-4"><rect x="652" y="167" width="172" height="116" fill="#F5F7FA" stroke="#DCE3EC"/><text x="662" y="203" font-size="26" fill="#0E2A47" font-weight="700">4 · Route</text><text x="662" y="244" font-size="24" fill="#172B42">Path / query /</text><text x="662" y="272" font-size="24" fill="#172B42">body checks</text></g><g id="step-5"><rect x="848" y="167" width="172" height="116" fill="#F5F7FA" stroke="#DCE3EC"/><text x="858" y="203" font-size="26" fill="#0E2A47" font-weight="700">5 · Rules</text><text x="858" y="244" font-size="24" fill="#172B42">Read / save</text><text x="858" y="272" font-size="24" fill="#172B42">business logic</text></g><g id="step-6"><rect x="1044" y="167" width="172" height="116" fill="#F5F7FA" stroke="#DCE3EC"/><text x="1054" y="203" font-size="26" fill="#0E2A47" font-weight="700">6 · ORM</text><text x="1054" y="244" font-size="24" fill="#172B42">Select / join</text><text x="1054" y="272" font-size="24" fill="#172B42">or add Lead</text></g><g id="step-7"><rect x="1044" y="350" width="172" height="116" fill="#EAF5EF" stroke="#16734D"/><text x="1054" y="386" font-size="26" fill="#0E2A47" font-weight="700">7 · DB</text><text x="1054" y="427" font-size="24" fill="#172B42">SQL / commit</text><text x="1054" y="455" font-size="24" fill="#172B42">constraints</text></g><g id="step-8"><rect x="848" y="350" width="172" height="116" fill="#F5F7FA" stroke="#DCE3EC"/><text x="858" y="386" font-size="26" fill="#0E2A47" font-weight="700">8 · Reload</text><text x="858" y="427" font-size="24" fill="#172B42">Save only:</text><text x="858" y="455" font-size="24" fill="#172B42">expire_all()</text></g><g id="step-9"><rect x="652" y="350" width="172" height="116" fill="#F5F7FA" stroke="#DCE3EC"/><text x="662" y="386" font-size="26" fill="#0E2A47" font-weight="700">9 · Model</text><text x="662" y="427" font-size="24" fill="#172B42">Pydantic</text><text x="662" y="455" font-size="24" fill="#172B42">response</text></g><g id="step-10"><rect x="456" y="350" width="172" height="116" fill="#F5F7FA" stroke="#DCE3EC"/><text x="466" y="386" font-size="26" fill="#0E2A47" font-weight="700">10 · JSON</text><text x="466" y="427" font-size="24" fill="#172B42">_json() +</text><text x="466" y="455" font-size="24" fill="#172B42">jsonify()</text></g><g id="step-11"><rect x="260" y="350" width="172" height="116" fill="#F5F7FA" stroke="#DCE3EC"/><text x="270" y="386" font-size="26" fill="#0E2A47" font-weight="700">11 · Client</text><text x="270" y="427" font-size="24" fill="#172B42">unwrap() /</text><text x="270" y="455" font-size="24" fill="#172B42">safe errors</text></g><g id="step-12"><rect x="64" y="350" width="172" height="116" fill="#F5F7FA" stroke="#DCE3EC"/><text x="74" y="386" font-size="26" fill="#0E2A47" font-weight="700">12 · UI</text><text x="74" y="427" font-size="24" fill="#172B42">Save: refetch</text><text x="74" y="455" font-size="24" fill="#172B42">list + stats</text></g><text x="64" y="514" font-size="24" fill="#53667A" font-weight="700">SETUP ONLY · Explicit CLI, separate from page and save requests</text><rect x="64" y="532" width="192" height="44" fill="#F5F7FA" stroke="#DCE3EC"/><rect x="64" y="576" width="192" height="44" fill="#FFFFFF" stroke="#DCE3EC"/><text x="74" y="562" font-size="24" fill="#0E2A47" font-weight="700">A · Snapshot</text><text x="74" y="606" font-size="24" fill="#172B42">GAF JSON</text><rect x="256" y="532" width="192" height="44" fill="#F5F7FA" stroke="#DCE3EC"/><rect x="256" y="576" width="192" height="44" fill="#FFFFFF" stroke="#DCE3EC"/><text x="266" y="562" font-size="24" fill="#0E2A47" font-weight="700">B · CLI</text><text x="266" y="606" font-size="24" fill="#172B42">CLI import</text><rect x="448" y="532" width="192" height="44" fill="#F5F7FA" stroke="#DCE3EC"/><rect x="448" y="576" width="192" height="44" fill="#FFFFFF" stroke="#DCE3EC"/><text x="458" y="562" font-size="24" fill="#0E2A47" font-weight="700">C · Validate</text><text x="458" y="606" font-size="24" fill="#172B42">Normalize</text><rect x="640" y="532" width="192" height="44" fill="#F5F7FA" stroke="#DCE3EC"/><rect x="640" y="576" width="192" height="44" fill="#FFFFFF" stroke="#DCE3EC"/><text x="650" y="562" font-size="24" fill="#0E2A47" font-weight="700">D · Upsert</text><text x="650" y="606" font-size="24" fill="#172B42">Source facts</text><rect x="832" y="532" width="192" height="44" fill="#F5F7FA" stroke="#DCE3EC"/><rect x="832" y="576" width="192" height="44" fill="#FFFFFF" stroke="#DCE3EC"/><text x="842" y="562" font-size="24" fill="#0E2A47" font-weight="700">E · Score</text><text x="842" y="606" font-size="24" fill="#172B42">Imported IDs</text><rect x="1024" y="532" width="192" height="44" fill="#F5F7FA" stroke="#DCE3EC"/><rect x="1024" y="576" width="192" height="44" fill="#FFFFFF" stroke="#DCE3EC"/><text x="1034" y="562" font-size="24" fill="#0E2A47" font-weight="700">F · Persist</text><text x="1034" y="606" font-size="24" fill="#172B42">Score version</text><text x="64" y="660" font-size="21" fill="#53667A">Errors: 422 input · 404 missing · commit conflict: rollback, then 200 or 409. No live GAF/AI call.</text></g></svg>